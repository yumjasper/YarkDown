<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YarkText</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                  script-src 'self' 'wasm-unsafe-eval';
                  style-src 'self' 'unsafe-inline';
                  img-src * data: file:;
                  font-src 'self' data:;
                  "
    />
  </head>

  <body>
    <div id="app"><div class="boot-shell" role="status"><strong>YarkText</strong><span>正在准备编辑器…</span></div></div>
    <style>
      html,body { margin: 0; background: #fff; }
      .boot-shell { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #59616b; font: 13px 'Segoe UI', 'Microsoft YaHei UI', sans-serif; }
      .boot-shell strong { font-size: 22px; font-weight: 500; }
      @media (prefers-color-scheme: dark) { html,body { background: #242424; } .boot-shell { color: #c6c8cb; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
